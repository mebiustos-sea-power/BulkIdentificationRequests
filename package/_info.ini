[Language_en]
Name=Bulk Identification Requests
Description=Adds Request ID from all unknowns below Orders > Identify in your units' right-click menu. Sends the standard request once to each detected unknown contact. Communication limits, responses and exposure of the sender are unchanged. Requires Anchor Chain. Enable this mod, then restart the game.

[Language_ja]
Name=Bulk Identification Requests
Description=自軍ユニットの右クリックメニューの命令＞目標識別の下に「全不明接触の身元を求める」を追加します。探知済みの不明接触に通常の身元確認要求を１回ずつ送ります。通信制限・応答・発信元の露見は標準処理に従います。Anchor Chainが必要です。有効にした後、ゲームを再起動してください。
